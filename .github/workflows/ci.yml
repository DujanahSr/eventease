name: Eventease CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================================
  # Job 1: Backend Automated Testing & Packaging (Spring Boot 3 + Java 21)
  # =========================================================================
  backend-ci:
    name: Backend Test & Build (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Unit Tests (JUnit 5 + Mockito)
        run: ./mvnw clean test

      - name: Build Production JAR
        run: ./mvnw package -DskipTests

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  # =========================================================================
  # Job 2: Frontend Linting & Production Build (React 18 + TypeScript + Vite)
  # =========================================================================
  frontend-ci:
    name: Frontend Typecheck & Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: TypeScript Compile & Vite Build
        run: npm run build

  # =========================================================================
  # Job 3: Docker Compose DevOps Validation
  # =========================================================================
  devops-ci:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
