# =========================================================================
# Test Configuration for Eventease CI & Local Testing
# =========================================================================
spring.application.name=eventease-test

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventease_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:DujanahSr07}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Redis Cache for Tests
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=none

# RabbitMQ: Disable auto listener startup during tests
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

# Mail
spring.mail.host=localhost
spring.mail.port=25

# JWT Test Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Midtrans Mock / Test Keys
midtrans.server.key=SB-Mid-server-test12345
midtrans.client.key=SB-Mid-client-test12345
