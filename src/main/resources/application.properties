spring.application.name=eventease
server.port=8081
# Hibernate properties
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://localhost:3306/eventease_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate.SQL=INFO

# Import local secrets (this file is gitignored)
spring.config.import=optional:file:./src/main/resources/application-secret.properties

# Midtrans Configuration
midtrans.server.key=${MIDTRANS_SERVER_KEY:}
midtrans.client.key=${MIDTRANS_CLIENT_KEY:}
midtrans.is.production=false

# Mail Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dujanahsr07@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}


