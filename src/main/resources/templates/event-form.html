<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.id != null ? 'Edit Acara | Eventease' : 'Buat Acara | Eventease'}">Buat Acara</title>
    <!-- PWA & SEO -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#110b29">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kikk-style.css}">
    <style>
        body {
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Full Background Image with Gradient Overlay */
        .page-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('/images/organizer_bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }
        .page-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(11, 6, 22, 0.85) 0%, rgba(11, 6, 22, 0.6) 100%);
            z-index: -1;
        }

        /* Floating Sidebar/Header logic is simplified for form pages. 
           We use a floating top navigation instead. */
        .top-nav {
            background: rgba(15, 10, 30, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        
        
        .card-custom {
            background: rgba(15, 10, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        
        /* Form Inputs */
        .form-control, .form-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--kikk-yellow);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255,215,0,0.1);
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-select option {
            background-color: #1a142c;
            color: #fff;
        }
        .form-label {
            color: rgba(255,255,255,0.7) !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem !important;
            font-weight: 600;
        }
        
        /* Info Alert */
        .alert-info-custom {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }
        
        /* Buttons */
        .btn-outline-custom {
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .btn-outline-custom:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
    
        /* Mobile Responsiveness */
        @media (max-width: 767.98px) {
            .card-custom {
                padding: 20px !important;
            }
            .top-nav {
                padding: 15px 20px !important;
            }
            h3.kikk-title {
                font-size: 1.8rem !important;
            }
        }
    
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="/dashboard" class="text-decoration-none kikk-title text-lowercase" style="font-size: 1.5rem; color: #fff;">Eventease.</a>
        <a href="/dashboard" class="btn btn-outline-custom rounded-pill px-4"><i class="fas fa-arrow-left"></i><span class="d-none d-sm-inline ms-2">Kembali ke Dashboard</span></a>
    </div>
    
    <div class="main-content container">
        <div class="row justify-content-center">
            <div class="col-xl-8 col-lg-10">
                <div class="card card-custom">
                    <h3 class="fw-bold text-center mb-5 kikk-title text-uppercase" style="font-size: 2.2rem; color: var(--kikk-yellow);" th:text="${event.id != null ? 'Edit Detail Acara' : 'Buat Acara Baru'}"></h3>
                    <div th:if="${error}" class="alert alert-danger mb-4 rounded-4" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444;" th:text="${error}"></div>
                    
                    <form th:action="@{/events/add}" th:object="${event}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" th:if="${event.id != null}"/> 
                        <div class="mb-4">
                            <label for="name" class="form-label"><i class="fas fa-heading me-2 text-warning"></i>Nama Acara</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Contoh: Konser Musik Jakarta 2026" minlength="5" maxlength="100" required />
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="date" class="form-label"><i class="fas fa-calendar-day me-2 text-warning"></i>Tanggal Pelaksanaan</label>
                                <input type="date" th:field="*{date}" class="form-control" th:attr="min=${#temporals.format(#temporals.createNow().plusDays(1), 'yyyy-MM-dd')}" required />
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="location" class="form-label"><i class="fas fa-map-marker-alt me-2 text-warning"></i>Lokasi</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="Contoh: Gelora Bung Karno" minlength="3" required />
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="description" class="form-label"><i class="fas fa-align-left me-2 text-warning"></i>Deskripsi Acara</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Ceritakan detail menarik tentang acara Anda..." minlength="20" required></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="category" class="form-label"><i class="fas fa-tag me-2 text-warning"></i>Kategori Event</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="">-- Pilih Kategori Utama --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${event.category != null and cat.id == event.category.id}"></option>
                            </select>
                        </div>
                        <!-- Tampilkan gambar lama jika ada -->
                        <div th:if="${event.imageUrl != null}" class="mb-4 text-center p-3 rounded-4" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);">
                            <p class="form-label mb-3">Poster Saat Ini</p>
                            <img th:src="${event.imageUrl}" alt="Event Image" class="rounded" style="max-height: 250px; border: 2px solid rgba(255,215,0,0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.3);" />
                        </div>
                        <div class="mb-5">
                            <label for="file" class="form-label"><i class="fas fa-image me-2 text-warning"></i>Upload Poster Acara (Opsional)</label>
                            <input type="file" name="file" class="form-control" accept="image/*" />
                        </div>
                        
                        <div class="alert alert-info-custom border-0 rounded-4 p-4 mb-5">
                            <i class="fas fa-info-circle me-2"></i><strong>Langkah Selanjutnya:</strong> Setelah Anda menyimpan acara ini, Anda akan diarahkan ke halaman <strong>Kelola Tiket</strong> untuk mengatur harga dan kapasitas tiket (Reguler, VIP, dll).
                        </div>
                        
                        <div class="d-flex flex-column flex-md-row justify-content-end gap-3 mt-4">
                            <a href="/dashboard" class="btn btn-outline-custom rounded-pill px-5 py-3 fw-bold text-center w-100">Batal</a>
                            <button type="submit" class="btn-kikk rounded-pill px-5 py-3 fw-bold border-0 w-100">Simpan Acara & Lanjut <i class="fas fa-arrow-right ms-2"></i></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
