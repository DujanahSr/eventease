<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menunggu Pembayaran - Eventease</title>
    <!-- PWA & SEO -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFD700">
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/kikk-style.css}">
    
    <!-- Midtrans Snap JS -->
    <script th:src="${@environment.getProperty('midtrans.is.production')} ? 'https://app.midtrans.com/snap/snap.js' : 'https://app.sandbox.midtrans.com/snap/snap.js'" th:attr="data-client-key=${@environment.getProperty('midtrans.client.key')}"></script>
    
    <style>
        .payment-container {
            max-width: 600px;
            margin: 3rem auto;
            position: relative;
            z-index: 2;
        }
        .invoice-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .timer {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--kikk-yellow);
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        
        .invoice-details {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        /* Loading Overlay for auto-trigger */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 6, 22, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }
        
        /* Floating Element Background */
        .bg-element {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center;">
    
    <div class="bg-element"></div>
    
    <div class="payment-container px-3 kikk-animate fade-in-only w-100">
        <div class="invoice-card">
            
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="mt-3 text-white" style="letter-spacing: 2px; font-weight: 600;">MEMBUKA SECURE PAYMENT...</div>
            </div>
            
            <i class="fas fa-lock mb-3" style="font-size: 2.5rem; color: var(--kikk-yellow);"></i>
            <h3 class="kikk-title mb-2" style="font-size: 2rem;">Menunggu Pembayaran</h3>
            <p style="color: rgba(255,255,255,0.6); font-size: 14px;">Segera selesaikan pembayaran Anda sebelum waktu habis.</p>
            
            <div class="timer mb-4 mt-4" id="countdown">24:00:00</div>
            
            <div class="invoice-details">
                <div class="d-flex justify-content-between mb-3">
                    <span style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase;">ID Pesanan</span>
                    <span style="font-family: monospace; font-size: 14px; font-weight: 600; color: #fff;" th:text="${booking.id}"></span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase;">Acara</span>
                    <span style="font-weight: 600; color: #fff;" th:text="${booking.ticketCategory.event.name}"></span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase;">Tipe Tiket</span>
                    <span style="font-weight: 600; color: var(--kikk-yellow);" th:text="${booking.ticketCategory.name} + ' (x' + ${booking.participants} + ')'"></span>
                </div>
                
                <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
                
                <div class="d-flex justify-content-between align-items-center">
                    <span style="font-size: 14px; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,0.8);">Total Tagihan</span>
                    <span style="font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #fff;" th:text="'Rp ' + ${#numbers.formatDecimal(booking.participants * booking.ticketCategory.price, 0, 'COMMA', 0, 'POINT')}"></span>
                </div>
            </div>
            
            <button id="pay-button" class="btn-kikk w-100 justify-content-center py-3 mb-3" th:attr="data-id=${booking.id}">
                <i class="fas fa-wallet me-2"></i> LANJUTKAN PEMBAYARAN
            </button>
            
            <a href="/bookings/booking-list" class="btn-kikk-outline w-100 justify-content-center py-3" style="border-color: rgba(255,255,255,0.2) !important; color: #fff !important;">
                BAYAR NANTI (KEMBALI)
            </a>
        </div>
    </div>

    <!-- Script Midtrans & Timer -->
    <script>
        let time = 24 * 3600; 
        setInterval(() => {
            let h = Math.floor(time / 3600).toString().padStart(2, '0');
            let m = Math.floor((time % 3600) / 60).toString().padStart(2, '0');
            let s = (time % 60).toString().padStart(2, '0');
            document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
            time--;
        }, 1000);

        function triggerPayment(bookingId) {
            const btn = document.getElementById('pay-button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> MEMPROSES...';
            
            fetch('/payments/pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ bookingId: bookingId })
            })
            .then(response => response.text())
            .then(token => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').classList.add('d-none'), 500);
                
                if (token.startsWith('Error') || token === 'Unauthorized' || token === 'Booking not found' || token === 'Already Paid') {
                    Swal.fire({
                        title: 'Terjadi Kesalahan',
                        text: token,
                        icon: 'error',
                        background: '#111827',
                        color: '#fff',
                        confirmButtonColor: '#FFD700'
                    });
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-wallet me-2"></i> LANJUTKAN PEMBAYARAN';
                    return;
                }
                
                // Tampilkan Midtrans Pop-up
                window.snap.pay(token, {
                    onSuccess: function (result) {
                        fetch('/bookings/update-status', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({ id: bookingId, status: 'PAID' })
                        }).then(() => {
                            window.location.href = "/bookings/invoice/" + bookingId;
                        });
                    },
                    onPending: function (result) {
                        Swal.fire({
                            title: 'Tertunda',
                            text: 'Pembayaran tertunda. Silakan selesaikan instruksi pembayaran.',
                            icon: 'info',
                            background: '#111827',
                            color: '#fff',
                            confirmButtonColor: '#FFD700'
                        });
                    },
                    onError: function (result) {
                        Swal.fire({
                            title: 'Gagal',
                            text: 'Pembayaran Gagal!',
                            icon: 'error',
                            background: '#111827',
                            color: '#fff',
                            confirmButtonColor: '#FFD700'
                        });
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-wallet me-2"></i> ULANGI PEMBAYARAN';
                    },
                    onClose: function () {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-wallet me-2"></i> LANJUTKAN PEMBAYARAN';
                    }
                });
            })
            .catch(err => {
                document.getElementById('loadingOverlay').classList.add('d-none');
                Swal.fire({
                    title: 'Kesalahan Koneksi',
                    text: 'Terjadi kesalahan koneksi ke server.',
                    icon: 'error',
                    background: '#111827',
                    color: '#fff',
                    confirmButtonColor: '#FFD700'
                });
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-wallet me-2"></i> LANJUTKAN PEMBAYARAN';
            });
        }
        
        document.getElementById('pay-button').addEventListener('click', function () {
            document.getElementById('loadingOverlay').classList.remove('d-none');
            document.getElementById('loadingOverlay').style.opacity = '1';
            triggerPayment(this.getAttribute('data-id'));
        });
        
        window.onload = function() {
            setTimeout(() => {
                triggerPayment(document.getElementById('pay-button').getAttribute('data-id'));
            }, 800);
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
