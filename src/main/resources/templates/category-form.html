<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kategori Acara | Eventease Admin</title>
    <!-- PWA & SEO -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#110b29">
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kikk-style.css}">
    
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>

    <!-- Sidebar -->
    
    <!-- Mobile Header (Visible only on small screens) -->
    <div class="mobile-header d-lg-none">
        <h2 class="mobile-brand" style="color: #38bdf8;">Command Center</h2>
        <button class="sidebar-toggler" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Admin -->
<div class="sidebar">
        <div class="brand kikk-title text-lowercase">
            Eventease.
        </div>
        <ul class="sidebar-menu">
            <li><a href="/dashboard"><i class="fas fa-users-cog"></i> Kelola Pengguna</a></li>
            <li><a href="/categories" class="active"><i class="fas fa-tags"></i> Kategori Acara</a></li>
            <li><a href="/admin/withdrawals"><i class="fas fa-hand-holding-usd"></i> Pencairan Dana</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout-user" class="btn btn-outline-custom w-100 d-flex align-items-center justify-content-center gap-2" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> Keluar
            </a>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 text-center text-md-start">
            <div>
                <h4 class="mb-0 fw-bold kikk-title text-uppercase" style="font-size: 1.5rem;" th:text="${category.id != null ? 'EDIT KATEGORI ACARA' : 'TAMBAH KATEGORI ACARA'}">TAMBAH KATEGORI</h4>
                <small style="color: rgba(255,255,255,0.5);">Masukkan detail kategori acara dengan benar</small>
            </div>
            <div>
                <a href="/categories" class="btn btn-outline-custom"><i class="fas fa-arrow-left me-2"></i>Kembali ke Daftar</a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom">
                    <h5 class="fw-bold mb-4 pb-3" style="border-bottom: 1px solid rgba(255,255,255,0.1); color: #38bdf8;">
                        <i class="fas fa-edit me-2"></i>Informasi Kategori
                    </h5>
                    <form th:action="${category.id != null ? '/categories/update' : '/categories'}" th:object="${category}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div th:if="${error}" class="alert alert-danger rounded-3 mb-4" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444;">
                            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                        </div>
                        
                        <div class="mb-4">
                            <label for="name" class="form-label">Nama Kategori Acara <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Contoh: Konser Musik, Olahraga, Stand-up Comedy" required />
                        </div>
                        
                        <div class="mb-5">
                            <label for="description" class="form-label">Deskripsi Kategori</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Berikan penjelasan singkat mengenai kategori ini..."></textarea>
                            <div class="form-text mt-2" style="color: rgba(255,255,255,0.4); font-size: 0.85rem;">Bantu penyelenggara dan pembeli memahami cakupan dari kategori acara ini.</div>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-3 mt-2 pt-4" style="border-top: 1px solid rgba(255,255,255,0.1);">
                            <a href="/categories" class="btn btn-outline-custom py-2">Batal</a>
                            <button type="submit" class="btn-kikk">
                                <i class="fas fa-save me-2"></i>Simpan Kategori
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
            }
        }
    </script>
</body>
</html>
