<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${feedback.id != null ? 'Edit Ulasan | Eventease' : 'Beri Ulasan | Eventease'}">Beri Ulasan | Eventease</title>
    <!-- PWA & SEO -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFD700">
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/kikk-style.css}">
    <style>
        .feedback-container {
            max-width: 800px;
            margin: 3rem auto;
            position: relative;
            z-index: 2;
        }
        .kikk-feedback-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .feedback-header {
            padding: 40px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }
        .feedback-body {
            padding: 40px 30px;
        }
        
        .kikk-input-group {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }
        .kikk-input-group-text {
            padding: 15px;
            background: transparent;
            border: none;
            color: var(--kikk-yellow);
        }
        .kikk-input-group .kikk-form-control {
            border: none;
            background: transparent;
            padding-left: 0;
        }
        .kikk-input-group .kikk-form-control:focus {
            box-shadow: none;
        }
        .kikk-input-group .kikk-form-control[readonly] {
            color: rgba(255,255,255,0.5);
            cursor: not-allowed;
        }
        
        .star-rating-input {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 15px;
        }
        .star-rating-input input {
            display: none;
        }
        .star-rating-input label {
            cursor: pointer;
            font-size: 3rem;
            color: rgba(255,255,255,0.1);
            transition: all 0.2s ease-in-out;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .star-rating-input label:hover,
        .star-rating-input label:hover ~ label,
        .star-rating-input input:checked ~ label {
            color: var(--kikk-yellow);
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            transform: scale(1.1);
        }
        
        /* Floating Element Background */
        .bg-element {
            position: absolute;
            top: 20%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }
    
        /* Mobile Responsiveness */
        @media (max-width: 767.98px) {
            .feedback-container {
                margin: 1.5rem 10px !important;
            }
            .feedback-header {
                padding: 30px 20px !important;
            }
            .feedback-header .kikk-title {
                font-size: 2rem !important;
            }
            .feedback-body {
                padding: 30px 20px !important;
            }
            .star-rating-input label {
                font-size: 2.2rem !important;
            }
            .star-rating-input {
                gap: 5px !important;
            }
            .kikk-feedback-card {
                border-radius: 16px !important;
            }
        }

    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Navbar Premium -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid px-4 position-relative justify-content-center">
            <a href="/bookings/booking-list" class="position-absolute start-0 ms-3 btn-kikk-outline btn-sm px-2 px-sm-3" style="font-size: 12px;">
                <i class="fas fa-arrow-left"></i> <span class="d-none d-sm-inline ms-2">KEMBALI</span>
            </a>
            <a class="navbar-brand d-none d-sm-block" href="/">Eventease Feedback</a>
        </div>
    </nav>
    
    <div class="bg-element"></div>
    
    <div class="container my-5 flex-grow-1">
        <div class="feedback-container kikk-animate fade-in-only">
            <div class="kikk-feedback-card">
                <div class="feedback-header">
                    <i class="fas fa-star mb-3" style="font-size: 3rem; color: var(--kikk-yellow);"></i>
                    <h3 class="kikk-title" style="font-size: 2.5rem;" th:text="${feedback.id != null ? 'Edit Ulasan Anda' : 'Bagikan Pengalaman Anda'}">Bagikan Pengalaman Anda</h3>
                    <p style="color: rgba(255,255,255,0.6); margin-bottom: 0;">Ulasan Anda sangat berarti bagi penyelenggara untuk acara yang lebih baik lagi di masa depan.</p>
                </div>
                <div class="feedback-body">
                    <form th:action="@{/feedbacks}" th:object="${feedback}" method="post">
                        <input type="hidden" th:field="*{id}" th:if="${feedback.id != null}" />
                        
                        <!-- User Info (Readonly) -->
                        <div class="mb-4">
                            <label class="kikk-form-label">Nama Pengguna</label>
                            <div class="kikk-input-group">
                                <span class="kikk-input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" th:value="${feedback.user != null ? feedback.user.name : ''}" 
                                       class="kikk-form-control" readonly>
                            </div>
                        </div>
                        
                        <!-- Acara / Event -->
                        <div class="mb-5">
                            <label class="kikk-form-label">Acara yang Dinilai</label>
                            <div class="kikk-input-group">
                                <span class="kikk-input-group-text"><i class="fas fa-ticket-alt"></i></span>
                                <!-- Jika acara sudah terpilih otomatis -->
                                <th:block th:if="${feedback.event != null and feedback.event.id != null}">
                                    <input type="hidden" th:field="*{event.id}" />
                                    <input type="text" class="kikk-form-control" th:value="${feedback.event.name}" readonly>
                                </th:block>
                                <!-- Jika acara belum terpilih -->
                                <th:block th:unless="${feedback.event != null and feedback.event.id != null}">
                                    <select th:field="*{event.id}" class="kikk-form-control" style="appearance: auto; padding-right: 30px;" id="event" required>
                                        <option value="" disabled selected>-- Pilih Acara --</option>
                                        <option th:each="evt : ${events}" th:value="${evt.id}" 
                                                th:text="${evt.name}" style="background: var(--bg-dark); color: #fff;"></option>
                                    </select>
                                </th:block>
                            </div>
                        </div>
                        
                        <!-- Rating (Visual Stars) -->
                        <div class="mb-5 text-center">
                            <label class="kikk-form-label d-block text-center mb-3" style="font-size: 1.2rem;">Seberapa puas Anda?</label>
                            <div class="star-rating-input">
                                <input type="radio" id="star5" name="rating" value="5" th:field="*{rating}" required />
                                <label for="star5" title="5 Bintang"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star4" name="rating" value="4" th:field="*{rating}" required />
                                <label for="star4" title="4 Bintang"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star3" name="rating" value="3" th:field="*{rating}" required />
                                <label for="star3" title="3 Bintang"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star2" name="rating" value="2" th:field="*{rating}" required />
                                <label for="star2" title="2 Bintang"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star1" name="rating" value="1" th:field="*{rating}" required />
                                <label for="star1" title="1 Bintang"><i class="fas fa-star"></i></label>
                            </div>
                        </div>
                        
                        <!-- Comment -->
                        <div class="mb-5">
                            <label for="comment" class="kikk-form-label">Tuliskan Komentar Anda</label>
                            <textarea th:field="*{comment}" class="kikk-form-control" id="comment" rows="5"
                                      placeholder="Ceritakan pengalaman Anda selama mengikuti acara ini..." required style="background: rgba(0,0,0,0.3); padding: 15px;"></textarea>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <a href="/bookings/booking-list" class="btn-kikk-outline w-100 justify-content-center py-3 text-center" style="border-color: rgba(255,255,255,0.2) !important; color: #fff !important;">BATAL</a>
                            </div>
                            <div class="col-sm-6">
                                <button type="submit" class="btn-kikk w-100 justify-content-center py-3"><i class="fas fa-paper-plane me-2"></i> KIRIM ULASAN</button>
                            </div>
                        </div>
                        
                        <div class="text-center mt-5">
                            <a href="/feedbacks" style="color: var(--kikk-yellow); font-size: 13px; text-decoration: none; letter-spacing: 1px;"><i class="fas fa-history me-1"></i> LIHAT RIWAYAT ULASAN SAYA</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer KIKK Style -->
    <footer class="footer-kikk mt-auto">
        <div class="container fade-in-only">
            <h2 class="kikk-title footer-title" style="font-size: 2rem;">EVENT TICKET</h2>
            <div class="footer-bottom mt-4">
                <div>
                    <span style="color: var(--kikk-yellow); margin-right: 15px;"><i class="fas fa-ticket-alt"></i> Eventease</span>
                </div>
                <div>
                    &copy;2026 Eventease ASBL.
                </div>
            </div>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
