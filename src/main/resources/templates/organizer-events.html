<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Acara | Eventease</title>
    <!-- PWA & SEO -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#110b29">
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/kikk-style.css}">
    <style>
        body {
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Full Background Image with Gradient Overlay */
        .page-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('/images/organizer_bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }
        .page-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(11, 6, 22, 0.85) 0%, rgba(11, 6, 22, 0.6) 100%);
            z-index: -1;
        }

        /* Main Content Area */
        
        
        /* Topbar Glass */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 35px;
            border-radius: 24px;
        }
        
        /* Search Box */
        .search-wrap {
            max-width: 600px;
        }
        .search-wrap .input-group {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            overflow: hidden;
            transition: 0.3s;
        }
        .search-wrap .input-group:focus-within {
            border-color: var(--kikk-yellow);
            box-shadow: 0 0 15px rgba(255,215,0,0.2);
        }
        .search-wrap .input-group-text {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            padding-left: 20px;
        }
        .search-wrap .form-control {
            background: transparent;
            border: none;
            color: #fff;
            padding: 14px 15px;
        }
        .search-wrap .form-control:focus {
            box-shadow: none;
        }
        .search-wrap .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .search-wrap .btn-srch {
            background: var(--kikk-yellow);
            color: #000;
            border: none;
            padding: 0 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .search-wrap .btn-srch:hover {
            background: #e6c200;
        }

        /* Event Cards */
        .event-card {
            background: rgba(15, 10, 30, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .event-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(255,215,0,0.05) 0%, transparent 60%);
            opacity: 0;
            transition: 0.5s;
        }
        .event-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,215,0,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.1);
        }
        .event-card:hover::before {
            opacity: 1;
        }
        .event-card-img-wrap {
            height: 200px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .event-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .event-card:hover .event-card-img {
            transform: scale(1.05);
        }
        .cat-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            color: var(--kikk-yellow);
            font-weight: 600;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.75rem;
            border: 1px solid rgba(255,215,0,0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .event-body {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }
        .event-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .event-meta {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .event-meta i {
            color: var(--kikk-yellow);
            width: 16px;
        }
        .actions {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-act {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-act.k { background: rgba(255,215,0,0.1); color: var(--kikk-yellow); border: 1px solid rgba(255,215,0,0.2); }
        .btn-act.k:hover { background: var(--kikk-yellow); color: #000; }
        .btn-act.e { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-act.e:hover { background: rgba(255,255,255,0.2); }
        .btn-act.d { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .btn-act.d:hover { background: #ef4444; color: #fff; }

        /* Pagination */
        .pagination .page-link {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            margin: 0 5px;
            border-radius: 12px !important;
            transition: 0.3s;
        }
        .pagination .page-item.active .page-link {
            background: var(--kikk-yellow);
            border-color: var(--kikk-yellow);
            color: #000;
            font-weight: 700;
        }
        .pagination .page-link:hover:not(.active) {
            background: rgba(255,255,255,0.1);
            color: var(--kikk-yellow);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            background: rgba(15, 10, 30, 0.4);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 24px;
            backdrop-filter: blur(15px);
        }
        .empty-icon {
            font-size: 4rem;
            color: rgba(255,215,0,0.2);
            margin-bottom: 20px;
        }
    
        /* Mobile Responsiveness for Topbar */
        @media (max-width: 991.98px) {
            .topbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
                margin-top: 60px; /* space for mobile header */
            }
            .topbar .d-flex.align-items-center {
                flex-direction: column;
                gap: 10px !important;
                width: 100%;
            }
            .topbar .btn-kikk, .topbar .btn-kikk-outline {
                width: 100%;
            }
        }

    
        .main-content {
            margin-left: auto !important;
            margin-right: auto !important;
            max-width: 1200px;
            padding-top: 120px;
        }
        @media (max-width: 991.98px) {
            .main-content { padding-top: 100px; }
            .topbar { margin-top: 0 !important; }
        }

    
        .btn-outline-custom {
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .btn-outline-custom:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        @media (max-width: 991.98px) {
            .topbar { flex-direction: column; gap: 20px; text-align: center; }
            .search-wrap { width: 100% !important; margin: 0 !important; }
        }

    
        .top-nav {
            background: rgba(15, 10, 30, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        @media (max-width: 767.98px) {
            
            .top-nav { 
                flex-direction: column; 
                gap: 15px; 
                padding: 15px !important; 
                text-align: center;
            }
            .top-nav .d-flex {
                width: 100%;
                justify-content: center;
            }

        }

    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>

    
    
    </div>

    
    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="/dashboard" class="text-decoration-none kikk-title text-lowercase" style="font-size: 1.5rem; color: #fff;">Eventease.</a>
        <div class="d-flex gap-2 gap-md-3">
            <a href="/" class="btn btn-outline-custom rounded-pill px-3 px-md-4" style="text-decoration: none;"><i class="fas fa-home me-2"></i><span class="d-none d-sm-inline">Beranda</span></a>
            <a href="/dashboard" class="btn btn-outline-custom rounded-pill px-3 px-md-4" style="text-decoration: none;"><i class="fas fa-arrow-left me-2"></i><span class="d-none d-sm-inline">Dashboard</span></a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar">
            <div>
                <div style="font-size: 12px; letter-spacing: 2px; color: var(--kikk-yellow); margin-bottom: 5px; font-weight: 600;">MANAJEMEN ACARA</div>
                <h4 class="mb-0 fw-bold kikk-title text-uppercase" style="font-size: 2rem;">Acara Saya</h4>
            </div>
            
            <div class="search-wrap flex-grow-1 mx-0 mx-lg-5 w-100">
                <form th:action="@{/organizer/events}" method="GET">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" name="search" class="form-control" th:value="${search}" placeholder="Cari nama acara Anda...">
                        <button class="btn-srch" type="submit">Cari</button>
                    </div>
                </form>
            </div>
            
            <div>
                <a href="/events/add" class="btn-kikk py-2 px-4 shadow"><i class="fas fa-plus me-2"></i>BUAT ACARA BARU</a>
            </div>
        </div>

        <p class="text-muted mb-4 small" th:if="${!events.isEmpty()}" th:text="${'Menampilkan ' + events.size() + ' acara'}"></p>

        <!-- Events List -->
        <div th:if="${!events.isEmpty()}" class="row g-4 mb-5">
            <div class="col-xl-4 col-md-6" th:each="event : ${events}">
                <div class="event-card">
                    <div class="event-card-img-wrap">
                        <div class="position-absolute top-0 start-0 m-3" style="z-index:2;">
                            <span class="cat-badge" th:if="${event.category != null}" th:text="${event.category.name}">Kategori</span>
                        </div>
                        <img th:if="${event.imageUrl != null}" class="event-card-img" th:src="${event.imageUrl}" alt="Poster">
                        <img th:unless="${event.imageUrl != null}" class="event-card-img" src="https://placehold.co/400x200/1e1e2d/ffd700?text=No+Image" alt="Default">
                    </div>
                    <div class="event-body">
                        <h4 class="event-title" th:text="${event.name}">Nama Acara</h4>
                        <div class="event-meta"><i class="far fa-calendar-alt"></i><span th:text="${event.date}">Tanggal</span></div>
                        <div class="event-meta"><i class="fas fa-map-marker-alt"></i><span th:text="${event.location}">Lokasi</span></div>
                        <p class="mt-3 mb-0" style="color: rgba(255,255,255,0.4); font-size: 0.85rem; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;" th:text="${event.description}">Deskripsi...</p>
                        
                        <div class="actions mt-4">
                            <a th:href="@{/tickets/manage/{id}(id=${event.id})}" class="btn-act k"><i class="fas fa-ticket-alt"></i> Tiket</a>
                            <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn-act e"><i class="fas fa-edit"></i> Edit</a>
                            <a th:href="@{/events/delete/{id}(id=${event.id})}" class="btn-act d" onclick="confirmAction(event,this.href,'Yakin ingin menghapus acara ini secara permanen?')"><i class="fas fa-trash-alt"></i> Hapus</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${events.isEmpty()}" class="empty-state">
            <div class="empty-icon"><i class="fas fa-calendar-times"></i></div>
            <h4 class="kikk-title mb-2" style="font-size: 2rem;">Belum Ada Acara</h4>
            <p style="color: rgba(255,255,255,0.5); margin-bottom: 30px;">Anda belum membuat acara apa pun atau acara tidak ditemukan.</p>
            <a href="/events/add" class="btn-kikk"><i class="fas fa-plus me-2"></i> Buat Acara Pertama Anda</a>
        </div>

        <div th:if="${eventPage.totalPages > 1}" class="d-flex justify-content-center mt-auto pb-4">
            <nav><ul class="pagination mb-0">
                <li class="page-item" th:classappend="${eventPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/organizer/events(page=${eventPage.number - 1},search=${search})}"><i class="fas fa-chevron-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0,eventPage.totalPages-1)}" th:classappend="${eventPage.number==i} ? 'active'">
                    <a class="page-link" th:href="@{/organizer/events(page=${i},search=${search})}" th:text="${i+1}">1</a>
                </li>
                <li class="page-item" th:classappend="${eventPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/organizer/events(page=${eventPage.number + 1},search=${search})}"><i class="fas fa-chevron-right"></i></a>
                </li>
            </ul></nav>
        </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function confirmAction(e,url,msg){
            e.preventDefault();
            Swal.fire({
                title: 'Konfirmasi',
                text: msg,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                background: '#111827',
                color: '#fff',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal',
                reverseButtons: true
            }).then(r=>{
                if(r.isConfirmed){
                    Swal.fire({
                        title: 'Memproses...',
                        allowOutsideClick: false,
                        background: '#111827',
                        color: '#fff',
                        didOpen: () => Swal.showLoading()
                    });
                    window.location.href = url;
                }
            });
        }
    </script>

    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('show');
            document.querySelector('.sidebar-overlay').classList.toggle('show');
        }
    </script>
</body>

</html>
