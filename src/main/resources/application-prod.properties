# ===================================================================
# Eventease Production Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=prod or -Dspring.profiles.active=prod
# ===================================================================

# Database Schema Safety: Validate only (Never auto-alter tables in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optimized Production Logging
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.eventease=INFO

# Payment Gateway: Production Switch
midtrans.is.production=${MIDTRANS_IS_PRODUCTION:true}

# Swagger UI: Disable in production by default unless explicitly enabled
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
